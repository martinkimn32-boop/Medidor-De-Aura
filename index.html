<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Aura RPG - Edición Épica Completa</title>

  <!-- Firebase SDKs para el Ranking Global -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-color: #ffd700;
      --bg-color: #0d0d11;
      --panel-bg: rgba(22, 22, 30, 0.88);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas de Fuego */
    #fireCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Interfaz de Juego */
    .game-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      background: var(--panel-bg);
      border: 2px solid var(--primary-color);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.3);
      backdrop-filter: blur(12px);
      text-align: center;
      transition: transform 0.2s ease, border-color 0.5s ease;
    }

    /* Marcadores Superiores */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .stats-badge {
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 215, 0, 0.4);
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .stats-badge div {
      margin: 2px 0;
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--primary-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--primary-color);
      color: #000;
      transform: scale(1.05);
    }

    /* Contador de Aura */
    .aura-display {
      margin: 15px 0;
    }

    .aura-title {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #bbb;
    }

    .aura-value {
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--primary-color);
      text-shadow: 0 0 25px var(--primary-color);
      line-height: 1;
      margin: 10px 0;
    }

    .rank-tag {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid var(--primary-color);
      font-weight: bold;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Caja de Retos */
    .challenge-box {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .challenge-desc {
      font-size: 1.2rem;
      margin-bottom: 18px;
      line-height: 1.45;
      font-weight: 600;
    }

    .btn-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .action-btn {
      background: linear-gradient(135deg, #2c2c38, #1a1a24);
      color: #fff;
      border: 1px solid var(--primary-color);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 110px;
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
      background: var(--primary-color);
      color: #000;
    }

    /* Barra de Tiempo */
    .timer-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      margin-top: 18px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--primary-color);
      transition: width 0.05s linear;
    }

    /* Medalla de Patreon Flotante */
    .patreon-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #ff424d;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      display: none;
      box-shadow: 0 0 12px rgba(255, 66, 77, 0.6);
      z-index: 12;
    }

    /* EFECTO CORTE SAMURÁI */
    .slash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      display: none;
    }

    .slash-line {
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 5px;
      background: #fff;
      box-shadow: 0 0 25px #00ffff, 0 0 50px #ffffff;
      transform: rotate(-25deg);
      animation: katanaCut 0.4s ease-out forwards;
    }

    @keyframes katanaCut {
      0% { opacity: 0; transform: rotate(-25deg) scaleX(0); }
      50% { opacity: 1; transform: rotate(-25deg) scaleX(1); }
      100% { opacity: 0; transform: rotate(-25deg) scaleX(1.1); }
    }

    .split-top, .split-bottom {
      position: fixed;
      left: 0;
      width: 100%;
      height: 50%;
      background: rgba(255,255,255,0.06);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .split-top { top: 0; }
    .split-bottom { bottom: 0; }

    .slashed .split-top { transform: translate(-20px, -20px); }
    .slashed .split-bottom { transform: translate(20px, 20px); }

    .slash-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(0, 0, 0, 0.92);
      border: 3px solid var(--primary-color);
      padding: 22px 45px;
      border-radius: 16px;
      color: var(--primary-color);
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      box-shadow: 0 0 50px var(--primary-color);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 101;
    }

    .slash-banner.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Modal Generico */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(6px);
    }

    .modal-content {
      background: #16161e;
      border: 2px solid var(--primary-color);
      border-radius: 20px;
      padding: 30px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    .modal-title {
      font-size: 1.9rem;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .ranking-list {
      list-style: none;
      margin: 15px 0;
      max-height: 260px;
      overflow-y: auto;
      text-align: left;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.98rem;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--primary-color);
      background: #000;
      color: #fff;
      font-size: 1.05rem;
      margin: 15px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="fireCanvas"></canvas>

  <div class="patreon-badge" id="patreonBadge">🏅 Donador con Aura</div>

  <div class="game-container" id="gameContainer">
    <div class="top-bar">
      <div class="stats-badge">
        <div>🏆 <b>Máx Aura:</b> <span id="maxAura">0</span></div>
        <div>🎖️ <b>Rango Máx:</b> <span id="maxRango">Hierro</span></div>
      </div>
      <div class="header-btns">
        <button class="icon-btn" id="voiceBtn" title="Voz Narradora">🔊</button>
        <button class="icon-btn" id="rankingBtn" title="Ranking Global">🏆</button>
      </div>
    </div>

    <div class="aura-display">
      <div class="aura-title">Puntos de Aura</div>
      <div class="aura-value" id="auraCount">0</div>
      <div class="rank-tag" id="rankLabel">Hierro</div>
    </div>

    <div class="challenge-box" id="challengeBox">
      <div class="challenge-desc" id="challengeDesc">Cargando desafío...</div>
      <div class="btn-grid" id="btnGrid"></div>
      <div class="timer-container">
        <div class="timer-bar" id="timerBar"></div>
      </div>
    </div>
  </div>

  <!-- Capa de Corte Samurái -->
  <div class="slash-overlay" id="slashOverlay">
    <div class="split-top"></div>
    <div class="split-bottom"></div>
    <div class="slash-line"></div>
  </div>
  <div class="slash-banner" id="slashBanner">¡NUEVA META ALCANZADA!</div>

  <!-- Modal de Ranking -->
  <div class="modal" id="rankingModal">
    <div class="modal-content">
      <div class="modal-title">🏆 Top 10 Guerreros</div>
      <ul class="ranking-list" id="rankingList"></ul>
      <button class="action-btn" onclick="closeModal('rankingModal')">Cerrar</button>
    </div>
  </div>

  <!-- Modal Guardar Récord -->
  <div class="modal" id="saveRecordModal">
    <div class="modal-content">
      <div class="modal-title">⚡ ¡NUEVO RÉCORD!</div>
      <p>Has alcanzado un nuevo nivel de Aura. Ingresa tu apodo para el Ranking Global:</p>
      <input type="text" id="playerNameInput" class="input-field" placeholder="Tu Apodo de Guerrero" maxlength="15">
      <button class="action-btn" onclick="submitRecord()">Guardar Récord</button>
    </div>
  </div>

  <script>
    // Configuración Real de Firebase de tu Proyecto
    const firebaseConfig = {
      apiKey: "AIzaSyDHtKVJdCGA_JWucaOgquBXe0FiyNd0dQw",
      authDomain: "contador-de-aura-d5bb1.firebaseapp.com",
      databaseURL: "https://contador-de-aura-d5bb1-default-rtdb.firebaseio.com",
      projectId: "contador-de-aura-d5bb1",
      storageBucket: "contador-de-aura-d5bb1.firebasestorage.app",
      messagingSenderId: "749065236616",
      appId: "1:749065236616:web:753573ba56d1664523ef3d",
      measurementId: "G-87G7DBD8B8"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log("Error de conexión a Firebase:", e);
    }

    // Estado del Juego
    let aura = 0;
    let auraMax = parseInt(localStorage.getItem('auraMax')) || 0;
    let rangoMax = localStorage.getItem('rangoMax') || 'Hierro';
    let soundEnabled = true;
    let currentChallenge = null;
    let timerInterval = null;
    let patreonUnlocked = false;
    let recentChallenges = [];

    // Sistema de 10 Rangos
    const RANKS = [
      { name: 'Hierro', min: 0, color: '#a0a0a0' },
      { name: 'Bronce', min: 10, color: '#cd7f32' },
      { name: 'Plata', min: 20, color: '#c0c0c0' },
      { name: 'Oro', min: 30, color: '#ffd700' },
      { name: 'Platino', min: 40, color: '#00ffff' },
      { name: 'Diamante', min: 50, color: '#b9f2ff' },
      { name: 'Maestro', min: 60, color: '#ff00ff' },
      { name: 'Gran Maestro', min: 70, color: '#ff4500' },
      { name: 'Challenger', min: 80, color: '#00ff88' },
      { name: 'Dios Absoluto del Aura', min: 100, color: '#ffffff' }
    ];

    // Elementos DOM
    const auraCountEl = document.getElementById('auraCount');
    const rankLabelEl = document.getElementById('rankLabel');
    const maxAuraEl = document.getElementById('maxAura');
    const maxRangoEl = document.getElementById('maxRango');
    const challengeDescEl = document.getElementById('challengeDesc');
    const btnGridEl = document.getElementById('btnGrid');
    const timerBarEl = document.getElementById('timerBar');
    const voiceBtnEl = document.getElementById('voiceBtn');

    updateStatsDisplay();

    // Web Audio API para Efectos Retro
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function speakText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    voiceBtnEl.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      voiceBtnEl.textContent = soundEnabled ? '🔊' : '🔇';
    });

    document.getElementById('rankingBtn').addEventListener('click', openRankingModal);

    function updateStatsDisplay() {
      auraCountEl.textContent = aura;
      maxAuraEl.textContent = auraMax;
      maxRangoEl.textContent = rangoMax;

      let currentRank = RANKS;
      for (let r of RANKS) {
        if (aura >= r.min) currentRank = r;
      }

      rankLabelEl.textContent = currentRank.name;
      rankLabelEl.style.color = currentRank.color;
      rankLabelEl.style.borderColor = currentRank.color;
      document.documentElement.style.setProperty('--primary-color', currentRank.color);

      // Guardar Rango Máximo
      if (RANKS.findIndex(r => r.name === currentRank.name) > RANKS.findIndex(r => r.name === rangoMax)) {
        rangoMax = currentRank.name;
        localStorage.setItem('rangoMax', rangoMax);
        maxRangoEl.textContent = rangoMax;
      }
    }

    // Efecto Corte Samurái
    function triggerSamuraiCut(title = "¡NUEVA META ALCANZADA!") {
      playBeep(880, 'sawtooth', 0.35);
      const overlay = document.getElementById('slashOverlay');
      const banner = document.getElementById('slashBanner');
      banner.textContent = title;
      
      overlay.style.display = 'block';
      document.body.classList.add('slashed');
      
      setTimeout(() => { banner.classList.add('active'); }, 150);

      setTimeout(() => {
        banner.classList.remove('active');
        document.body.classList.remove('slashed');
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
      }, 1800);
    }

    // BANCO COMPLETO DE RETOS (21+ Retos variados con Anti-Repetición)
    const CHALLENGE_POOL = [
      // 1. Cultura General - Historia
      () => ({
        id: "cg_historia_1",
        desc: "¿En qué año llegó el hombre a la Luna?",
        btns: [
          { text: "1969", correct: true },
          { text: "1975", correct: false },
          { text: "1962", correct: false }
        ],
        time: 6
      }),
      // 2. Cultura General - Cine
      () => ({
        id: "cg_cine_1",
        desc: "¿Cuál es la película más taquillera de la historia?",
        btns: [
          { text: "Avatar", correct: true },
          { text: "Titanic", correct: false },
          { text: "Avengers: Endgame", correct: false }
        ],
        time: 6
      }),
      // 3. Cultura General - Ciencia
      () => ({
        id: "cg_ciencia_1",
        desc: "¿Cuál es el planeta más grande del Sistema Solar?",
        btns: [
          { text: "Júpiter", correct: true },
          { text: "Saturno", correct: false },
          { text: "Neptuno", correct: false }
        ],
        time: 5
      }),
      // 4. Cultura General - Geografía
      () => ({
        id: "cg_geo_1",
        desc: "¿Cuál es el río más largo del mundo?",
        btns: [
          { text: "Amazonas", correct: true },
          { text: "Nilo", correct: false },
          { text: "Misisipi", correct: false }
        ],
        time: 6
      }),
      // 5. Cultura General - Videojuegos
      () => ({
        id: "cg_vj_1",
        desc: "¿Cómo se llama el reino donde vive la Princesa Peach?",
        btns: [
          { text: "Reino Champiñón", correct: true },
          { text: "Hyrule", correct: false },
          { text: "Kanto", correct: false }
        ],
        time: 6
      }),
      // 6. Anagrama / Reorganizar Palabra (+2 segundos extra)
      () => ({
        id: "anagrama_aura",
        desc: "Reorganiza las letras para formar la palabra: 'R-A-U-A'",
        btns: [
          { text: "AURA", correct: true },
          { text: "RANA", correct: false },
          { text: "ÁREA", correct: false }
        ],
        time: 8
      }),
      // 7. Anagrama / Palabra Épica (+2 segundos extra)
      () => ({
        id: "anagrama_rpg",
        desc: "Forma la palabra oculta: 'G-U-E-R-R-E-R-O'",
        btns: [
          { text: "GUERRERO", correct: true },
          { text: "GUITARRA", correct: false },
          { text: "RANGO", correct: false }
        ],
        time: 8
      }),
      // 8. Secuencia de Memoria (+2 segundos extra)
      () => {
        const colors = ['🔴 Rojo', '🔵 Azul', '🟢 Verde'];
        const target = colors[Math.floor(Math.random() * colors.length)];
        return {
          id: "memoria_colores",
          desc: `Memoriza y presiona rápidamente: ${target}`,
          btns: colors.map(c => ({ text: c, correct: c === target })),
          time: 7
        };
      },
      // 9. Secuencia de Símbolos (+2 segundos extra)
      () => {
        const icons = ['⚡ Rayo', '🔥 Fuego', '⭐ Estrella'];
        const target = icons[Math.floor(Math.random() * icons.length)];
        return {
          id: "memoria_simbolos",
          desc: `Toca el elemento correcto: ${target}`,
          btns: icons.map(i => ({ text: i, correct: i === target })),
          time: 7
        };
      },
      // 10. Precisión Extrema (Reducido a 0.5s)
      () => ({
        id: "precision_verde",
        desc: "¡REFLEJO PURO! Toca la zona verde en 0.5s.",
        btns: [
          { text: "🎯 ¡AQUÍ!", correct: true }
        ],
        time: 0.5
      }),
      // 11. Caza del Emoji Furtivo
      () => {
        const emojis = ['🐉', '👑', '⚔️', '🛡️'];
        const target = '👑';
        return {
          id: "caza_emoji",
          desc: "¡Caza la corona de Aura antes de que desaparezca!",
          btns: emojis.map(e => ({ text: e, correct: e === target })).sort(() => Math.random() - 0.5),

      },
      // 12. Matemáticas Relámpago - Suma
      () => {
        const a = Math.floor(Math.random() * 15) + 6;
        const b = Math.floor(Math.random() * 15) + 4;
        const correctAns = a + b;
        return {
          id: "math_suma",
          desc: `¿Cuánto es ${a} + ${b}?`,
          btns: [
            { text: `${correctAns}`, correct: true },
            { text: `${correctAns + 3}`, correct: false },
            { text: `${correctAns - 2}`, correct: false }
          ].sort(() => Math.random() - 0.5),
          time: 5
        };
      },
      // 13. Matemáticas Relámpago - Multiplicación
      () => {
        const a = Math.floor(Math.random() * 7) + 3;
        const b = Math.floor(Math.random() * 8) + 2;
        const correctAns = a * b;
        return {
          id: "math_mult",
          desc: `Multiplica: ${a} x ${b}`,
          btns: [
            { text: `${correctAns}`, correct: true },
            { text: `${correctAns + 4}`, correct: false },
            { text: `${correctAns - 3}`, correct: false }
          ].sort(() => Math.random() - 0.5),
          time: 5
        };
      },
      // 14. Elección Rápida de Color
      () => ({
        id: "eleccion_color",
        desc: "Selecciona el color del fuego del Rango Diamante:",
        btns: [

          { text: "Verde Neón", correct: false },
          { text: "Rojo Carmesí", correct: false }

      }),

      () => {
        const numA = Math.floor(Math.random() * 80) + 10;
        const numB = Math.floor(Math.random() * 80) + 10;
        const isAGreater = numA > numB;
        return {
          id: "mayor_menor",
          desc: `¿Es ${numA} MAYOR que ${numB}?`,
          btns: [
            { text: "Sí", correct: isAGreater },
            { text: "No", correct: !isAGreater }
          ],
          time: 4
        };
      },
      // 16. Identifica el Intruso
      () => ({
        id: "intruso_animal",
        desc: "Encuentra el intruso entre estos elementos:",
        btns: [
          { text: "🚗 Auto", correct: true },
          { text: "🐶 Perro", correct: false },
          { text: "🐱 Gato", correct: false }
        ],
        time: 5
      }),
      // 17. Desafío de Pulso y Calma
      () => ({
        id: "no_toques_rojo",
        desc: "¡Cuidado! NO toques el botón rojo:",
        btns: [
          { text: "🟢 Seguro", correct: true },
          { text: "🔴 PROHIBIDO", correct: false }
        ],
        time: 4
      }),
      // 18. Código de Aura Rápido
      () => ({
        id: "codigo_aura",
        desc: "Presiona el botón de rango supremo:",
        btns: [
          { text: "Dios Absoluto", correct: true },
          { text: "Hierro Base", correct: false }
        ],
        time: 4
      }),
      // 19. Capitales del Mundo
      () => ({
        id: "capital_japon",
        desc: "¿Cuál es la capital de Japón?",
        btns: [
          { text: "Tokio", correct: true },
          { text: "Kioto", correct: false },
          { text: "Osaka", correct: false }
        ],
        time: 5
      }),
      // 20. Conteo de Letras
      () => ({
        id: "conteo_letras",
        desc: "¿Cuántas letras 'A' tiene la palabra 'AURA'?",
        btns: [
          { text: "2", correct: true },
          { text: "1", correct: false },
          { text: "3", correct: false }
        ],
        time: 5
      }),
      // 21. Reto de Velocidad Pura
      () => ({
        id: "velocidad_pura",
        desc: "¡Toca el botón dorado YA!",
        btns: [
          { text: "🪙 ¡DORADO!", correct: true }
        ],
        time: 2
      })
    ];

    function createPatreonChallenge() {
      return {
        id: "patreon_special",
        desc: "⭐ RETO ESPECIAL: Visita la membresía de Patreon 'MartinKimn' para ganar +25 de Aura extra.",
        btns: [
          { 
            text: "🚀 Ir a Patreon (+25 Aura)", 
            correct: true, 
            action: () => {
              window.open("https://www.patreon.com/c/MartinKimn", "_blank");
              aura += 25;
              patreonUnlocked = true;
              document.getElementById('patreonBadge').style.display = 'block';
              triggerSamuraiCut("¡DONACIÓN PATREON (+25 AURA)!");
            }
          }
        ],
        time: 10
      };
    }

    function generateChallenge() {
      if (aura >= 30 && !patreonUnlocked && Math.random() < 0.35) {
        return createPatreonChallenge();
      }

      let candidate;
      let attempts = 0;
      do {
        const index = Math.floor(Math.random() * CHALLENGE_POOL.length);
        candidate = CHALLENGE_POOL[index]();
        attempts++;
      } while (recentChallenges.includes(candidate.id) && attempts < 20);

      recentChallenges.push(candidate.id);
      if (recentChallenges.length > 7) {
        recentChallenges.shift();
      }

      return candidate;
    }

    function startNextChallenge() {
      clearInterval(timerInterval);
      btnGridEl.innerHTML = '';

      currentChallenge = generateChallenge();
      challengeDescEl.textContent = currentChallenge.desc;
      speakText(currentChallenge.desc);

      currentChallenge.btns.forEach(btn => {
        const b = document.createElement('button');
        b.className = 'action-btn';
        b.textContent = btn.text;
        b.onclick = () => handleAnswer(btn);
        btnGridEl.appendChild(b);
      });

      let timeLeft = currentChallenge.time;
      const totalTime = currentChallenge.time;
      timerBarEl.style.width = '100%';

      timerInterval = setInterval(() => {
        timeLeft -= 0.05;
        const pct = Math.max(0, (timeLeft / totalTime) * 100);
        timerBarEl.style.width = pct + '%';

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleAnswer({ correct: false });
        }
      }, 50);
    }

    function handleAnswer(btn) {
      clearInterval(timerInterval);
      if (btn.action) btn.action();

      if (btn.correct) {
        playBeep(650, 'sine', 0.15);
        aura += 1;

        if (aura > auraMax) {
          auraMax = aura;
          localStorage.setItem('auraMax', auraMax);
          triggerSamuraiCut("¡NUEVO RÉCORD BORDADO!");
        }

        updateStatsDisplay();
        startNextChallenge();
      } else {
        playBeep(160, 'sawtooth', 0.35);
        alert(`¡Fallaste el reto! Tu puntuación final fue de ${aura} Aura.`);
        
        if (aura >= auraMax && aura > 5) {
          openSaveRecordModal();
        }

        aura = 0;
        updateStatsDisplay();
        startNextChallenge();
      }
    }

    // Modal de Ranking
    function openRankingModal() {
      const modal = document.getElementById('rankingModal');
      const list = document.getElementById('rankingList');
      list.innerHTML = 'Cargando ranking en vivo...';
      modal.style.display = 'flex';

      if (db) {
        db.ref('rankings').orderByChild('aura').limitToLast(10).once('value', snapshot => {
          list.innerHTML = '';
          let data = [];
          snapshot.forEach(child => { data.push(child.val()); });
          data.reverse();

          if (data.length === 0) {
            list.innerHTML = '<li class="ranking-item"><span>Sé el primero en guardar un récord.</span></li>';
            return;
          }

          data.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = 'ranking-item';
            li.innerHTML = `<span><b>#${idx+1}</b> ${item.name} (${item.rango})</span> <b>${item.aura} Aura</b>`;
            list.appendChild(li);
          });
        });
      } else {
        const myName = localStorage.getItem('playerName') || 'Tú';
        list.innerHTML = `
          <li class="ranking-item"><span><b>#1</b> LeyendaAura (Dios)</span> <b>99 Aura</b></li>
          <li class="ranking-item"><span><b>#2</b> ${myName} (${rangoMax})</span> <b>${auraMax} Aura</b></li>
        `;
      }
    }

    function openSaveRecordModal() {
      document.getElementById('saveRecordModal').style.display = 'flex';
    }

    function submitRecord() {
      const nameInput = document.getElementById('playerNameInput').value.trim() || 'Guerrero Anónimo';
      localStorage.setItem('playerName', nameInput);

      if (db) {
        db.ref('rankings').push({
          name: nameInput,
          aura: auraMax,
          rango: rangoMax,
          timestamp: Date.now()
        });
      }

      closeModal('saveRecordModal');
      openRankingModal();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Canvas de Fuego
    const canvas = document.getElementById('fireCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for(let i=0; i<60; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3.5 + 1,
        speedY: Math.random() * 1.8 + 0.5,
        opacity: Math.random()
      });
    }

    function animateFire() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      particles.forEach(p => {
        p.y -= p.speedY;
        if(p.y < 0) p.y = canvas.height;
        ctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      requestAnimationFrame(animateFire);
    }
    animateFire();

    // Iniciar juego
    startNextChallenge();
  </script>
</body>
</html>
