<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<title>Contador de Aura RPG - 21 Retos</title>
<style>
:root {
    --rank: #a0a0a0;
    --rank-rgb: 200, 100, 0;
    --bg: #0d0a14;
    --panel-bg: rgba(20, 15, 30, 0.88);
}
* {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
html, body { height: 100%; }
body {
    background: radial-gradient(ellipse at 50% 55%, #1c1030 0%, var(--bg) 60%, #000 100%);
    color: #fff; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
}

/* ---------- Encabezado ---------- */
header { z-index: 10; text-align: center; margin-top: 16px; padding: 0 10px; flex: none; }
h1.title {
    font-size: clamp(1.8rem, 6vw, 2.9rem); text-transform: uppercase; letter-spacing: 4px;
    color: #ffcc00; text-shadow: 0 0 10px #ff5500, 0 0 20px #ff0000;
    animation: pulseText 2s infinite alternate;
}
@keyframes pulseText { from { transform: scale(1); } to { transform: scale(1.05); } }
.rank-badge {
    display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 20px;
    font-weight: bold; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 2px;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid var(--rank); color: var(--rank); box-shadow: 0 0 15px var(--rank);
    transition: border-color .5s, color .5s, box-shadow .5s;
}

/* ---------- Esquinas: Máx Aura (izq.) y Medalla de donador (der.) ---------- */
.max-aura-display {
    position: fixed; top: 14px; left: 16px; z-index: 20;
    background: rgba(20, 15, 30, .85); color: #00ffaa; padding: 8px 16px; border-radius: 20px;
    font-weight: 800; font-size: .95rem; text-transform: uppercase;
    border: 2px solid #00ffaa; box-shadow: 0 0 12px rgba(0, 255, 170, .3);
}
.donor-medal {
    position: fixed; top: 14px; right: 16px; z-index: 20; display: none;
    background: linear-gradient(135deg, #ffd700, #ff8800); color: #000;
    padding: 8px 16px; border-radius: 20px; border: 2px solid #fff;
    font-weight: 900; font-size: .95rem; text-transform: uppercase;
    box-shadow: 0 0 15px #ffd700; animation: medalGlow 1.5s infinite alternate;
}
.donor-medal.show { display: block; }
@keyframes medalGlow {
    from { box-shadow: 0 0 10px #ffd700; transform: scale(1); }
    to   { box-shadow: 0 0 25px #ffaa00; transform: scale(1.05); }
}

/* ---------- Escenario (fuego + aura + temporizador) ---------- */
.stage { position: relative; flex: 1; width: 100%; min-height: 0; container-type: size; }
#fireCanvas {
    --fire: min(92vw, 440px, 44vh);
    position: absolute; inset: 0; margin: auto;
    width: var(--fire); height: var(--fire); z-index: 1; pointer-events: none;
}
@supports (width: 1cqw) { #fireCanvas { --fire: min(92cqw, 440px, 100cqh); } }

.aura-container {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.aura-score {
    font-size: clamp(3.6rem, 13vw, 5.5rem); font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 0 20px var(--rank), 0 0 40px var(--rank);
}
.aura-label { font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; color: #ffd700; opacity: .85; }

.float-pop {
    position: absolute; left: 50%; top: 38%; z-index: 20; pointer-events: none; white-space: nowrap;
    font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 900; color: #ffe066;
    text-shadow: 0 0 12px #ff9900, 0 0 24px #ff5500; opacity: 0;
}

/* Temporizador gigante */
.timer-display {
    position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%); z-index: 8;
    pointer-events: none; opacity: 0; transition: opacity .25s; text-align: center;
    font-size: clamp(2.6rem, 9vw, 3.5rem); font-weight: 900; color: #ff3333;
    text-shadow: 0 0 20px #f00; font-variant-numeric: tabular-nums;
}
.timer-display.active { opacity: 1; }
.timer-scale { display: inline-block; transform: scale(var(--s, 1)); transition: transform .1s linear; will-change: transform; }
#timerValue { display: inline-block; }
.timer-display.danger #timerValue { animation: throb .35s infinite alternate ease-in-out; }
@keyframes throb {
    from { transform: scale(1); color: #ffaa00; }
    to   { transform: scale(1.18); color: #ff0000; text-shadow: 0 0 40px #f00; }
}

/* ---------- Panel RPG ---------- */
.rpg-panel {
    z-index: 10; flex: none; width: 92%; max-width: 620px; position: relative;
    margin-bottom: max(20px, env(safe-area-inset-bottom));
    background: var(--panel-bg); border: 3px solid var(--rank); border-radius: 12px; padding: 18px;
    box-shadow: 0 0 25px rgba(var(--rank-rgb), .35), inset 0 0 15px rgba(0, 0, 0, .8);
    text-align: center; backdrop-filter: blur(6px);
    transition: border-color .5s, box-shadow .5s;
}
.challenge-badge {
    display: inline-block; font-size: .72rem; letter-spacing: 2px; text-transform: uppercase;
    color: #ffbe3b; background: rgba(120, 70, 0, .5); border: 1px solid rgba(255, 190, 59, .5);
    padding: 3px 10px; border-radius: 6px; margin-bottom: 10px;
}
.challenge-text {
    min-height: 64px; margin-bottom: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; line-height: 1.35;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .8);
}
.prompt-main { font-size: clamp(1.05rem, 4vw, 1.3rem); }
.prompt-main.go { color: #00ff66; font-weight: 900; font-size: 1.5rem; text-shadow: 0 0 15px #00ff66; }
.prompt-main.fail-title { color: #ff4444; font-weight: 900; text-shadow: 0 0 15px #f00; }
.prompt-main.big { font-size: 2.4rem; font-weight: 900; letter-spacing: 8px; color: #ffe066; text-shadow: 0 0 15px #ff9900; }
.hint { font-size: .88rem; opacity: .75; font-weight: 400; }
.prompt-main.go + .hint { opacity: 1; }

.interactive-zone {
    min-height: 80px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
}
.interactive-zone.frozen { pointer-events: none; opacity: .6; }
.emoji-board { flex-basis: 100%; font-size: 1.8rem; line-height: 1.5; word-spacing: 4px; }

.btn-challenge {
    background: linear-gradient(135deg, #ff8800, #ff2200); border: 2px solid #ffe600; color: #fff;
    padding: 12px 26px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 34, 0, .4); transition: transform .1s;
}
.btn-challenge:active { transform: scale(.95); }
.btn-challenge:disabled { opacity: .6; cursor: default; }
.btn-yes { background: linear-gradient(135deg, #00ff88, #00aa44); border-color: #fff; }
.btn-no  { background: linear-gradient(135deg, #ff3333, #aa0000); border-color: #fff; }
.color-btn {
    width: 66px; height: 66px; border-radius: 10px; border: 3px solid #fff; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .5); transition: transform .1s, filter .1s, box-shadow .1s;
}
.color-btn:active { transform: scale(.9); }
.color-btn:disabled { cursor: default; }
.color-btn.lit { filter: brightness(1.9); transform: scale(1.14); box-shadow: 0 0 28px #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
input[type="text"] {
    background: rgba(0, 0, 0, .7); border: 2px solid var(--rank); color: #fff; padding: 10px 15px;
    font-size: 1.2rem; border-radius: 6px; text-align: center; outline: none;
    width: 80%; max-width: 300px; user-select: text; -webkit-user-select: text;
}

/* Medidor de tiempo (parada segura / pulso firme) */
.hold-bar {
    position: relative; width: min(85%, 420px); height: 28px; overflow: hidden;
    background: rgba(0, 0, 0, .6); border: 2px solid #555; border-radius: 14px;
    transition: border-color .2s, box-shadow .2s;
}
.hold-bar.ok { border-color: #00ff66; box-shadow: 0 0 22px #00ff66; }
.hold-fill {
    position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); will-change: transform;
    background: linear-gradient(90deg, #ffbb00, #ff0055);
}
.hold-bar.ok .hold-fill { background: linear-gradient(90deg, #00ff88, #00ffcc); }
.hold-zone {
    position: absolute; top: 0; bottom: 0; right: 0; pointer-events: none;
    background: rgba(0, 255, 100, .3); border-left: 2px dashed #00ff66;
}
.hold-bar.ok .hold-zone { background: rgba(0, 255, 100, .55); }

/* Aviso flotante de bonus */
.bonus-toast {
    position: absolute; left: 50%; top: -10px; transform: translate(-50%, -60%);
    background: #00ffaa; color: #000; font-weight: bold; padding: 5px 15px; border-radius: 20px;
    box-shadow: 0 0 15px #00ffaa; opacity: 0; pointer-events: none;
    width: max-content; max-width: 88vw; text-align: center;
    transition: opacity .3s, transform .3s;
}
.bonus-toast.show { opacity: 1; transform: translate(-50%, -110%); }

@media (max-height: 640px) {
    header { margin-top: 8px; }
    .rank-badge { margin-top: 6px; padding: 3px 12px; }
    .rpg-panel { padding: 12px; }
    .challenge-text { min-height: 52px; }
}
@media (max-width: 640px) {
    .max-aura-display, .donor-medal { top: 6px; padding: 4px 10px; font-size: .7rem; }
    .max-aura-display { left: 6px; }
    .donor-medal { right: 6px; }
    header { margin-top: 38px; }
}
@media (prefers-reduced-motion: reduce) {
    h1.title, .donor-medal, .timer-display.danger #timerValue { animation: none; }
}
</style>
</head>
<body>

<header>
    <h1 class="title">Contador de Aura</h1>
    <div id="rankBadge" class="rank-badge">Rango: Hierro</div>
</header>

<div id="maxAuraDisplay" class="max-aura-display">🏆 Máx Aura: 0</div>
<div id="donorMedal" class="donor-medal">🛡️ Donador con Aura</div>

<main class="stage" id="stage">
    <canvas id="fireCanvas" aria-hidden="true"></canvas>

    <div class="aura-container">
        <div class="aura-score" id="auraScore">0</div>
        <div class="aura-label">Aura Absoluta</div>
    </div>

    <div class="timer-display" id="timerDisplay" aria-hidden="true">
        <div class="timer-scale" id="timerScale"><span id="timerValue">5.0</span></div>
    </div>
</main>

<section class="rpg-panel">
    <div id="bonusToast" class="bonus-toast" role="status"></div>
    <div class="challenge-badge" id="challengeBadge">RETO</div>
    <div class="challenge-text">
        <span id="promptMain" class="prompt-main">Cargando desafío...</span>
        <span id="promptSub" class="hint"></span>
    </div>
    <div class="interactive-zone" id="interactiveZone"></div>
</section>

<script>
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = $('stage'), canvas = $('fireCanvas'), scoreEl = $('auraScore'),
      badgeEl = $('rankBadge'), toastEl = $('bonusToast'), challengeBadge = $('challengeBadge'),
      promptMain = $('promptMain'), promptSub = $('promptSub'), zoneEl = $('interactiveZone'),
      timerEl = $('timerDisplay'), timerScale = $('timerScale'), timerValue = $('timerValue'),
      maxEl = $('maxAuraDisplay'), donorMedal = $('donorMedal');

const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function div(cls) { const d = document.createElement('div'); d.className = cls; return d; }
function store(key, value) {
    try {
        if (value === undefined) return localStorage.getItem(key) || '';
        localStorage.setItem(key, value);
    } catch (e) { return ''; }
}

/* =====================================================================
   AUDIO (Web Audio API): el contexto se crea en la primera interacción
   ===================================================================== */
const Sound = (() => {
    let ac = null;
    function ctx() {
        if (!ac) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ac = new AC();
        }
        if (ac.state === 'suspended') ac.resume();
        return ac;
    }
    function tone(type, f1, f2, dur, vol, delay = 0) {
        const a = ctx();
        if (!a) return;
        const t = a.currentTime + delay;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f1, t);
        if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(a.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
    }
    return {
        unlock: ctx,
        click()   { tone('sine', 400, 800, 0.06, 0.25); },
        tick()    { tone('square', 880, 880, 0.04, 0.08); },
        alarm()   { tone('square', 1200, 800, 0.12, 0.14); },
        ping()    { tone('triangle', 1318, 1318, 0.15, 0.22); },
        success() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, f, 0.25, 0.25, i * 0.08)); },
        fail() {
            tone('sawtooth', 220, 40, 0.8, 0.4);
            tone('square', 110, 30, 0.9, 0.25, 0.1);
            tone('sawtooth', 90, 25, 1.0, 0.2, 0.3);
        }
    };
})();
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => Sound.unlock(), { once: true }));

/* =====================================================================
   RANGOS
   ===================================================================== */
const RANKS = [
    { min: 0,   name: "Hierro",                 color: "#a0a0a0", fire: [200, 100, 0] },
    { min: 10,  name: "Bronce",                 color: "#cd7f32", fire: [220, 120, 20] },
    { min: 20,  name: "Plata",                  color: "#e0e0e0", fire: [180, 200, 220] },
    { min: 30,  name: "Oro",                    color: "#ffd700", fire: [255, 215, 0] },
    { min: 40,  name: "Platino",                color: "#00efb8", fire: [0, 239, 184] },
    { min: 50,  name: "Diamante",               color: "#b9f2ff", fire: [185, 242, 255] },
    { min: 60,  name: "Maestro",                color: "#9932cc", fire: [153, 50, 204] },
    { min: 70,  name: "Gran Maestro",           color: "#ff0055", fire: [255, 0, 85] },
    { min: 80,  name: "Challenger",             color: "#ffff55", fire: [255, 255, 85] },
    { min: 100, name: "Dios Absoluto del Aura", color: "#ffffff", fire: [255, 255, 255] }
];

/* =====================================================================
   FUEGO (Canvas optimizado: sprites precalculados, sin shadowBlur)
   ===================================================================== */
const W = 400, H = 400, MAX_PARTICLES = 120;
const cctx = canvas.getContext('2d');
let lastDpr = 0;

function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (dpr === lastDpr) return;
    lastDpr = dpr;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas();
window.addEventListener('resize', setupCanvas);

function buildSprite(rgb, core = 0.55) {
    const s = document.createElement('canvas');
    s.width = s.height = 64;
    const g = s.getContext('2d');
    const [r, gr, b] = rgb;
    const cr = Math.round(r + (255 - r) * core), cg = Math.round(gr + (255 - gr) * core), cb = Math.round(b + (255 - b) * core);
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(${cr},${cg},${cb},1)`);
    grad.addColorStop(0.35, `rgba(${r},${gr},${b},0.85)`);
    grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return s;
}
function buildGlow(rgb) {
    const s = document.createElement('canvas');
    s.width = s.height = 256;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, `rgba(${rgb.join(',')},0.55)`);
    grad.addColorStop(1, `rgba(${rgb.join(',')},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 256);
    return s;
}

const SPRITE_BOOST = buildSprite([255, 225, 110], 0.6);
const fire = {
    count: 48, size: 1, speed: 1, spread: 1, alpha: 1, glow: 0.22,
    sprite: null, glowSprite: null, boostUntil: 0
};

function setFire(rgb, level, critical) {
    if (critical) {
        Object.assign(fire, { count: 20, size: 0.6, speed: 0.7, spread: 0.8, alpha: 0.45, glow: 0.06 });
        rgb = [120, 25, 25]; // tono crítico
    } else {
        Object.assign(fire, {
            count: Math.min(MAX_PARTICLES, Math.round(48 + level * 7)),
            size: 0.9 + level * 0.07, speed: 1 + level * 0.04, spread: 1 + level * 0.05,
            alpha: 1, glow: 0.22 + level * 0.04
        });
    }
    fire.sprite = buildSprite(rgb);
    fire.glowSprite = buildGlow(rgb);
}

class Particle {
    constructor() { this.reset(true); }
    reset(initial = false) {
        this.x = W / 2 + (Math.random() - 0.5) * 60 * fire.spread;
        this.y = H - 80 - (initial ? Math.random() * 120 : 0);
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = -(Math.random() * 3 + 2);
        this.size = (Math.random() * 18 + 12) * fire.size;
        this.life = initial ? Math.random() : 1;
        this.decay = Math.random() * 0.03 + 0.015;
    }
    update(k, speed) {
        this.x += this.vx * k * speed;
        this.y += this.vy * k * speed;
        this.size *= Math.pow(0.96, k);
        this.life -= this.decay * k;
        if (this.life <= 0 || this.size < 2) this.reset();
    }
}
const particles = Array.from({ length: MAX_PARTICLES }, () => new Particle());

let lastFrame = performance.now();
function fireLoop(now) {
    const k = Math.min(Math.max((now - lastFrame) / 16.667, 0), 3); // independiente de los Hz del monitor
    lastFrame = now;
    const boosting = now < fire.boostUntil;
    const sprite = boosting ? SPRITE_BOOST : fire.sprite;
    const speed = fire.speed * (boosting ? 1.5 : 1);
    const grow = boosting ? 1.25 : 1;

    cctx.clearRect(0, 0, W, H);
    cctx.globalCompositeOperation = 'lighter';

    cctx.globalAlpha = Math.min(1, fire.glow * (boosting ? 2 : 1));
    cctx.drawImage(fire.glowSprite, W / 2 - 140, H - 90 - 140, 280, 280);

    for (let i = 0; i < fire.count; i++) {
        const p = particles[i];
        p.update(k, speed);
        const s = p.size * grow;
        cctx.globalAlpha = Math.max(0, p.life) * fire.alpha;
        cctx.drawImage(sprite, p.x - s, p.y - s, s * 2, s * 2);
    }
    cctx.globalAlpha = 1;
    cctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(fireLoop);
}

/* =====================================================================
   ESTADO Y UI
   ===================================================================== */
const ANIMAL_KEYS = { d: 'auraLastAnimal', m: 'auraLastAnimalM' };
const lastAnimals = { d: store(ANIMAL_KEYS.d), m: store(ANIMAL_KEYS.m) };

let aura = 0;
let maxAura = Number(store('auraMax')) || 0;
let rankIdx = -1;
let run = null;
let challengeNumber = 0;
let donor = store('auraDonor') === '1';   // medalla permanente (se guarda en el navegador)
let donationOffered = false;              // el reto de donación sale una vez por partida
let toastTimer = 0;
const TRANSITION_MS = 750;

/* Memoria anti-repetición: un reto no vuelve hasta que pasen RECENT_LIMIT retos distintos */
const RECENT_LIMIT = 7;
let recentChallenges = [];

function rankIndexFor(a) {
    let idx = 0;
    for (let i = 0; i < RANKS.length; i++) if (a >= RANKS[i].min) idx = i;
    return idx;
}

function applyRank(force = false) {
    const idx = rankIndexFor(aura);
    if (idx === rankIdx && !force) return;
    const prev = rankIdx;
    rankIdx = idx;
    const r = RANKS[idx];
    root.style.setProperty('--rank', r.color);
    root.style.setProperty('--rank-rgb', r.fire.join(','));
    setText(badgeEl, `Rango: ${r.name}`);
    setFire(r.fire, idx, false);
    if (!reduceMotion && prev >= 0 && idx > prev) {
        badgeEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 500 });
    }
}

function updateMaxAura() {
    if (aura <= maxAura) return;
    maxAura = aura;
    store('auraMax', String(maxAura));
    setText(maxEl, `🏆 Máx Aura: ${maxAura}`);
    if (!reduceMotion) {
        maxEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 400 });
    }
}

function setPrompt(main, sub = '') {
    promptMain.className = 'prompt-main';
    promptSub.className = 'hint';
    setText(promptMain, main);
    setText(promptSub, sub);
}

function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function floatText(text) {
    const el = div('float-pop');
    el.textContent = text;
    stage.appendChild(el);
    if (reduceMotion) { el.style.opacity = 1; setTimeout(() => el.remove(), 900); return; }
    const anim = el.animate([
        { opacity: 0, transform: 'translate(-50%, 20px) scale(.5)' },
        { opacity: 1, transform: 'translate(-50%, -40px) scale(1.4)', offset: 0.35 },
        { opacity: 0, transform: 'translate(-50%, -110px) scale(1)' }
    ], { duration: 1300, easing: 'cubic-bezier(.1,.8,.3,1)' });
    anim.onfinish = () => el.remove();
}

function bumpScore() {

        { transform: 'scale(1)' },

}

function hideTimer() {
    timerEl.classList.remove('active', 'danger');
    timerScale.style.setProperty('--s', '1');
}

/* =====================================================================
   CICLO DE VIDA DE UN RETO
   Cada reto recibe un objeto "r" que registra TODO lo que abre (listeners,
   timeouts, animation frames) y lo limpia al ganar/perder. r.win y r.lose
   solo pueden ejecutarse una vez.
   ===================================================================== */
function createRun() {
    const r = { done: false, cleanups: [] };
    r.on = (target, type, fn, opts) => {
        target.addEventListener(type, fn, opts);
        r.cleanups.push(() => target.removeEventListener(type, fn, opts));
    };
    r.after = (ms, fn) => {
        const id = setTimeout(fn, ms);
        r.cleanups.push(() => clearTimeout(id));
    };
    r.timer = (seconds, opts) => startTimer(r, seconds, opts);
    r.dispose = () => {
        r.cleanups.splice(0).forEach(fn => fn());
        hideTimer();
    };
    r.win = (points = 1, msg = '') => {
        if (r.done) return;
        r.done = true; r.dispose();
        handleWin(points, msg);
    };
    r.lose = (reason = 'Has sucumbido a la presión.') => {
        if (r.done) return;
        r.done = true; r.dispose();
        handleLose(reason);
    };
    return r;
}

function startTimer(r, seconds, { grow = false } = {}) {
    const total = seconds * 1000;
    const t0 = performance.now();
    let id = 0;
    let lastWhole = Math.ceil(seconds);
    timerEl.classList.add('active');
    timerEl.classList.remove('danger');
    timerScale.style.setProperty('--s', '1');
    setText(timerValue, seconds.toFixed(1));

    const frame = () => {
        const left = Math.max(0, total - (performance.now() - t0));
        setText(timerValue, (left / 1000).toFixed(1));
        if (grow) timerScale.style.setProperty('--s', (1 + (1 - left / total) * 1.2).toFixed(2));
        if (left <= 2000) timerEl.classList.add('danger');
        const whole = Math.ceil(left / 1000);
        if (whole !== lastWhole && left > 0) {
            lastWhole = whole;
            if (left <= 2000) Sound.alarm(); else Sound.tick();
        }
        if (left <= 0) { r.lose('Se acabó el tiempo.'); return; }
        id = requestAnimationFrame(frame);
    };
    id = requestAnimationFrame(frame);
    r.cleanups.push(() => cancelAnimationFrame(id));
}

function handleWin(points, msg) {
    zoneEl.classList.add('frozen');
    zoneEl.querySelectorAll('input, button').forEach(el => { el.disabled = true; });
    Sound.success();

    aura += points;
    setText(scoreEl, String(aura));
    bumpScore();
    floatText(`+${points} AURA`);
    if (msg) toast(msg);
    updateMaxAura();

    fire.boostUntil = performance.now() + 700;
    if (!reduceMotion) {
        canvas.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 500, easing: 'ease-out' });
    }
    applyRank();
    setTimeout(nextChallenge, TRANSITION_MS);
}

function handleLose(reason) {
    run = null;
    Sound.fail();
    if (!reduceMotion) {
        document.body.animate([
            { transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' },
            { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }
        ], { duration: 500 });
    }
    aura = 0;
    setText(scoreEl, '0');
    applyRank(true);
    setFire(RANKS[0].fire, 0, true); // fuego en tono crítico, sin brillo
    fire.boostUntil = 0;

    challengeBadge.textContent = 'DERROTA';
    setPrompt('¡PERDISTE TU AURA!', reason);
    promptMain.classList.add('fail-title');

    zoneEl.classList.remove('frozen');
    zoneEl.replaceChildren();
    const retry = document.createElement('button');
    retry.className = 'btn-challenge';
    retry.textContent = 'Reintentar desde 0';
    retry.onclick = restart;
    zoneEl.appendChild(retry);
    // Se enfoca con retraso para que una tecla soltada justo ahora no lo active por accidente
    setTimeout(() => { if (retry.isConnected) retry.focus({ preventScroll: true }); }, 600);
}

function restart() {
    aura = 0;
    donationOffered = false;
    recentChallenges = [];
    challengeNumber = 0;
    setText(scoreEl, '0');
    applyRank(true);
    nextChallenge();
}

/* Elige el siguiente reto evitando los últimos RECENT_LIMIT */
function pickChallengeIndex() {
    if (recentChallenges.length === 0) return 0; // la partida siempre abre con el reto de clics
    const pool = [];
    for (let i = 0; i < CHALLENGES.length; i++) if (!recentChallenges.includes(i)) pool.push(i);
    return pick(pool);
}
function rememberChallenge(i) {
    recentChallenges.push(i);
    if (recentChallenges.length > RECENT_LIMIT) recentChallenges.shift();
}

function nextChallenge() {
    if (run) run.dispose();
    zoneEl.classList.remove('frozen');
    zoneEl.replaceChildren();
    run = createRun();

    // Reto especial de donación: no cuenta en el historial ni en la numeración
    if (shouldOfferDonation()) {
        donationOffered = true;
        challengeBadge.textContent = 'RETO ESPECIAL · APOYO';
        DONATION_CHALLENGE.run(zoneEl, run);
        return;
    }

    const i = pickChallengeIndex();
    rememberChallenge(i);
    challengeNumber++;
    challengeBadge.textContent = `RETO ${challengeNumber} · ${CHALLENGES[i].name}`;
    CHALLENGES[i].run(zoneEl, run);
}

/* =====================================================================
   HELPERS DE RETOS
   ===================================================================== */
function makeButton(zone, label, onClick) {
    const b = document.createElement('button');
    b.className = 'btn-challenge';
    b.textContent = label;
    b.addEventListener('click', onClick);
    // Evita "hacer trampa" dejando Enter apretado (autorepetición)
    b.addEventListener('keydown', e => { if (e.repeat) e.preventDefault(); });
    zone.appendChild(b);
    return b;
}

function makeInput(zone, placeholder, maxLength, inputMode) {
    const i = document.createElement('input');
    i.type = 'text';
    i.placeholder = placeholder;
    i.autocomplete = 'off';
    i.autocapitalize = 'off';
    i.spellcheck = false;
    i.enterKeyHint = 'send';
    if (maxLength) i.maxLength = maxLength;
    if (inputMode) i.inputMode = inputMode;
    zone.appendChild(i);
    i.focus({ preventScroll: true });
    return i;
}

function onSubmit(r, input, fn) {
    r.on(input, 'keydown', e => {
        if (e.key === 'Enter' && !e.repeat && !e.isComposing) {
            e.preventDefault();
            fn(input.value);
        }
    });
}

/* Medidor con zona verde: de 0 a "limit" segundos, la zona segura empieza en "goal" */
function createGauge(zone, goal, limit) {
    const bar = div('hold-bar'), fill = div('hold-fill'), safe = div('hold-zone');
    safe.style.left = `${(goal / limit) * 100}%`;
    bar.append(fill, safe);
    zone.appendChild(bar);
    return {
        update(t) {
            fill.style.transform = `scaleX(${Math.min(t / limit, 1)})`;
            const phase = t < goal ? 'charging' : (t <= limit ? 'ok' : 'over');
            if (phase === 'ok' && !bar.classList.contains('ok')) {
                bar.classList.add('ok');
                promptMain.classList.add('go');
                Sound.ping();
            }
            return phase;
        }
    };
}

/* Animal con una letra dada (D o M): +1 ejemplo, +2 original, +3 si además cambia respecto a la última vez */
function animalChallenge(letter, example) {
    const L = letter.toUpperCase();
    const re = new RegExp(`^${letter}[a-z ]{2,}$`);
    return {
        name: `Animal con ${L}`,
        run(zone, r) {
            setPrompt(`Escribe un animal que empiece con ${L} (Ej: ${example.label})`, 'Pulsa Enter para confirmar');
            const input = makeInput(zone, 'Escribe aquí...');
            onSubmit(r, input, raw => {
                const v = norm(raw);
                if (!re.test(v)) return r.lose(`Eso no es un animal que empiece con ${L}.`);
                let pts = 1, msg = '+1 Aura';
                if (v !== example.key) {
                    pts = 2; msg = '+2 Aura (¡Original!)';
                    if (lastAnimals[letter] && v !== lastAnimals[letter]) { pts = 3; msg = '+3 Aura (¡Novedoso y creativo!)'; }
                }
                lastAnimals[letter] = v;
                store(ANIMAL_KEYS[letter], v);
                r.win(pts, msg);
            });
        }
    };
}

/* Color: elegir el indicado (inverse = false) o cualquiera distinto (inverse = true) */
function colorChallenge(inverse) {
    return {

            setPrompt(inverse
                ? `¡Haz clic en un color DISTINTO a ${target.name}!`

            r.timer(4);
            shuffle(COLORS.slice()).forEach(c => {
                const b = document.createElement('button');
                b.className = 'color-btn';
                b.style.backgroundColor = c.hex;
                b.setAttribute('aria-label', c.name);
                b.addEventListener('click', () => {

    {
        name: 'Día de la semana',
        run(zone, r) {
            const startDay = DAYS[new Date().getDay()];
            setPrompt('¿Qué día de la semana es HOY? (en español)', 'Pulsa Enter para confirmar');
            r.timer(8);
            const input = makeInput(zone, 'Ej: lunes');
            onSubmit(r, input, raw => {
                const v = norm(raw);
                const today = DAYS[new Date().getDay()];
                if (v === today || v === startDay) r.win(1);
                else r.lose(`Hoy es ${today}.`);
            });
        }
    },

    /* 20. Simón: repetir la secuencia de colores */
    {
        name: 'Simón',
        run(zone, r) {
            const seq = Array.from({ length: 3 }, () => pick(COLORS));
            setPrompt('Memoriza la secuencia de colores...', 'Mira con atención');
            const pads = shuffle(COLORS.slice()).map(c => {
                const b = document.createElement('button');
                b.className = 'color-btn';
                b.style.backgroundColor = c.hex;
                b.setAttribute('aria-label', c.name);
                b.disabled = true;
                zone.appendChild(b);
                return { c, b };
            });
            const padOf = c => pads.find(p => p.c === c).b;

            const STEP = 800;
            seq.forEach((c, i) => {
                r.after(500 + i * STEP, () => { padOf(c).classList.add('lit'); Sound.ping(); });
                r.after(500 + i * STEP + 450, () => padOf(c).classList.remove('lit'));
            });

            let ready = false, pos = 0;
            r.after(500 + seq.length * STEP, () => {
                ready = true;
                pads.forEach(p => { p.b.disabled = false; });
                setPrompt('¡Repite la secuencia!', 'Haz clic en el mismo orden');
                r.timer(8);
            });
            pads.forEach(({ c, b }) => b.addEventListener('click', () => {
                if (!ready) return;
                Sound.click();
                if (c !== seq[pos]) return r.lose('Te equivocaste en la secuencia.');
                pos++;
                if (pos === seq.length) r.win(1);
            }));
        }
    },

    /* 21. Pulso firme: mantener pulsado el botón (ratón/dedo), sin teclado global */
    {
        name: 'Pulso firme',
        run(zone, r) {
            const GOAL = 3, LIMIT = 5;
            setPrompt('Mantén pulsado el botón durante 3 s', 'Margen de gracia: suéltalo en la zona verde (3 – 5 s)');
            const gauge = createGauge(zone, GOAL, LIMIT);
            const btn = document.createElement('button');
            btn.className = 'btn-challenge';
            btn.textContent = 'Mantén pulsado';
            btn.style.touchAction = 'none';
            zone.appendChild(btn);

            let holding = false, t0 = 0, raf = 0;
            r.cleanups.push(() => cancelAnimationFrame(raf));

            const frame = () => {
                const t = (performance.now() - t0) / 1000;
                const phase = gauge.update(t);
                if (phase === 'charging') {
                    setText(promptMain, `Cargando Aura... ${(GOAL - t).toFixed(1)} s`);
                    setText(promptSub, 'Mantén pulsado... ¡No sueltes todavía!');
                } else if (phase === 'ok') {
                    setText(promptMain, '¡SUÉLTALO AHORA!');
                    setText(promptSub, `Zona de éxito · quedan ${(LIMIT - t).toFixed(1)} s`);
                } else {
                    holding = false;
                    r.lose('Te pasaste de los 5 segundos.');
                    return;
                }
                raf = requestAnimationFrame(frame);
            };
            const press = () => {
                if (holding) return;
                holding = true; t0 = performance.now();
                raf = requestAnimationFrame(frame);
            };
            const release = () => {
                if (!holding) return;
                holding = false;
                cancelAnimationFrame(raf);
                const t = (performance.now() - t0) / 1000;
                if (t < GOAL) r.lose('Soltaste antes de los 3 segundos.');
                else if (t > LIMIT) r.lose('Te pasaste de los 5 segundos.');
                else r.win(1);
            };

            r.on(btn, 'pointerdown', e => { e.preventDefault(); press(); });
            r.on(window, 'pointerup', release);
            r.on(window, 'pointercancel', release);
            r.on(btn, 'contextmenu', e => e.preventDefault());
            // Alternativa de teclado solo con Enter y solo sobre el botón (nada global)
            r.on(btn, 'keydown', e => { if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); press(); } });
            r.on(btn, 'keyup', e => { if (e.key === 'Enter') { e.preventDefault(); release(); } });
            r.on(window, 'blur', () => {
                if (!holding) return;
                holding = false;
                cancelAnimationFrame(raf);
                r.lose('La ventana perdió el foco.');
            });
        }
    }
];

/* =====================================================================
   INICIO
   ===================================================================== */
setText(maxEl, `🏆 Máx Aura: ${maxAura}`);
if (donor) donorMedal.classList.add('show');
applyRank(true);
requestAnimationFrame(t => { lastFrame = t; fireLoop(t); });
nextChallenge();
</script>
